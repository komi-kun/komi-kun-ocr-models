# SPDX-License-Identifier: Apache-2.0
#
# Rebuilds the artifact from pinned inputs and attaches it to the `ocr-models-v3` release.
# Manual dispatch (or a `ocr-models-*` tag) publishes; PRs only build + smoke-test.
name: build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create/update
        default: ocr-models-v3
  push:
    tags:
      - "ocr-models-*"
  pull_request:

permissions:
  contents: write

jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build unzip python3-pip python3-yaml
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Build (Android .so for every ABI + models + host harness)
        run: ./build.sh --host

      - name: Smoke-test the engine on synthetic Japanese pages
        run: |
          python3 tests/make_pages.py tests
          ./out/paddle_ocr_host info \
            out/models/ppocrv6_small_det.onnx \
            out/models/ppocrv6_small_rec.onnx \
            out/models/ppocrv6_small_dict.txt
          # The harness reads binary PPM (P6), which make_pages.py already writes.
          ./out/paddle_ocr_host full \
            out/models/ppocrv6_small_det.onnx \
            out/models/ppocrv6_small_rec.onnx \
            out/models/ppocrv6_small_dict.txt \
            tests/page_horizontal.ppm tests/page_vertical.ppm > /tmp/ocr.txt
          cat /tmp/ocr.txt
          grep -q "何でも薄暗いじめじめした所で" /tmp/ocr.txt

      - name: Verify the published ABIs
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -f "out/lib/$abi/libpaddle_ocr.so"
            test -f "out/lib/$abi/libonnxruntime.so"
          done
          file out/lib/*/libpaddle_ocr.so

      - uses: actions/upload-artifact@v4
        with:
          name: komi-kun-ocr-models
          path: |
            out/manifest.json
            out/app-paddle-manifest.json
            out/lib/**
            out/models/**

      - name: Publish release assets
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "$TAG" --notes "Generated by .github/workflows/build.yml"
          # Release assets are a flat namespace: publish `lib/<abi>/<file>` and `models/<file>`
          # using the manifest's `path` field so the URLs stay stable.
          while read -r path; do
            gh release upload "$TAG" "out/$path#$path" --clobber || \
              gh release upload "$TAG" "out/$path" --clobber
          done < <(python3 -c "import json;m=json.load(open('out/manifest.json'));print('\n'.join(f['path'] for f in m['files']))")
          gh release upload "$TAG" out/manifest.json --clobber
          gh release upload "$TAG" out/app-paddle-manifest.json --clobber
